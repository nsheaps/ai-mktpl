[tools]
gh = "latest"
jq = "latest"
node = "lts"
python = "3.14.2"
bun = "latest"

"npm:@anthropic-ai/claude-code" = "latest"
"npm:prettier" = "latest"
"npm:eslint" = "latest"
yarn = "latest"

# 1Password CLI and op-exec
# TODO(#293): op-exec is commented out — it's a standalone script, not an
# asdf-style versioned tool. It lacks list-all/install scripts, causing
# "Failed to run list-all" errors on every bash command. Needs proper
# mise backend or manual install approach.
# "github:nsheaps/op-exec" = "latest"
1password = "latest"

[settings]
# Use shorter paths for tools
legacy_version_file = false
# Don't auto-install on every prompt — the mise plugin's SessionStart hook
# already runs `mise install -y`. This prevents failed tools (e.g. 1password
# GPG verification) from retrying on every bash command.
auto_install = false
