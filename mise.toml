[tools]
gh = "latest"
jq = "latest"
node = "lts"
python = "3.14.2"
bun = "latest"

"npm:@anthropic-ai/claude-code" = "latest"
"npm:prettier" = "latest"
"npm:eslint" = "latest"
yarn = "latest"

# 1Password CLI
# NOTE: op-exec is a standalone script, not an asdf-style versioned tool.
# It was removed from mise.toml because it lacks list-all/install scripts,
# causing "Failed to run list-all" errors on every bash command.
# Install op-exec separately if needed.
1password = "latest"

[settings]
# Use shorter paths for tools
legacy_version_file = false
# Don't auto-install on every prompt — the mise plugin's SessionStart hook
# already runs `mise install -y`. This prevents failed tools (e.g. 1password
# GPG verification) from retrying on every bash command.
auto_install = false
