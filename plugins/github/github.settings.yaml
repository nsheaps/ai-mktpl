# github plugin configuration
#
# Override per-project via ${CLAUDE_PROJECT_DIR}/.claude/plugins.settings.yaml
# or per-user via ~/.claude/plugins.settings.yaml under the "github" key.
#
# Set enabled: false to disable auto-install without uninstalling the plugin.

github:
  enabled: true

  # Download and install the gh binary if not already on PATH.
  # Set to false when gh is managed externally (e.g. via mise with gh in mise.toml).
  # When false, the plugin still runs autoAuthCheck if configured.
  autoInstall: true

  # Install gh to $CLAUDE_PROJECT_DIR/bin/.local on web sessions.
  # Only used when autoInstall is true.
  installToProject: true

  # Run installation in the background (non-blocking session start)
  backgroundInstall: false

  # Specific gh version to install (default: latest)
  # version: "2.87.3"
  version: 'latest'

  # Auto-run `gh auth status` after install to verify authentication
  autoAuthCheck: true

  # --- PR State Tracking ---
  #
  # Async hooks that monitor PR state (comments, reviews, CI status,
  # merge status) across all projects in the session. State is cached
  # locally and compared on each hook invocation. When changes are
  # detected (e.g., new review, CI status change), the agent is notified.

  # Enable/disable PR state tracking hooks.
  prStateTracking: true

  # Minimum seconds between PostToolUse checks (throttle/debounce).
  # Prevents excessive API calls on every tool use.
  # SessionStart and Stop always run regardless of this interval.
  prStateCheckInterval: 60

  # Cache directory for PR state snapshots.
  # Default: ~/.claude/plugin-cache/github
  # The plugin appends /<project-slug>/pr-state/ to this path.
  # For multi-project sessions, each project gets its own subdirectory.
  # Both ~ and $HOME are supported in paths.
  #
  # Suggested structure for project-specific overrides:
  #   ~/.claude/plugin-cache/github/<project-name>/pr-state/
  #
  # prStateCacheDir: "~/.claude/plugin-cache/github"
