# 1pass plugin configuration
#
# Override per-project via ${CLAUDE_PROJECT_DIR}/.claude/plugins.settings.yaml
# or per-user via ~/.claude/plugins.settings.yaml under the "1pass" key.
#
# Set enabled: false to disable auto-install without uninstalling the plugin.

1pass:
  enabled: true

  # Download and install the op binary if not already on PATH.
  # Set to false when op is managed externally (e.g. via mise with op in mise.toml).
  # When false, the plugin still validates that op is available.
  autoInstall: false

  # Install op to $CLAUDE_PROJECT_DIR/bin/.local on web sessions.
  # Only used when autoInstall is true.
  installToProject: true

  # Run installation in the background (non-blocking session start)
  backgroundInstall: false

  # Specific op CLI version to install (default: latest)
  # opVersion: "2.30.0"
  opVersion: 'latest'

  # Also install op-exec (from nsheaps/op-exec)
  # Set to false to skip op-exec installation.
  installOpExec: false

  # Specific op-exec version to install (default: latest)
  # opExecVersion: "1.0.0"
  opExecVersion: 'latest'

  # Inject 1Password secrets as environment variables at session start.
  # Requires op to be available and authenticated (OP_SERVICE_ACCOUNT_TOKEN set,
  # or op signed in interactively on local sessions).
  #
  # Each entry has:
  #   envVar:    (required) Environment variable name to set
  #   reference: (required) 1Password secret reference (op://vault/item/field)
  #   target:    (optional) Where to write the variable. One of:
  #                envFile          — append to CLAUDE_ENV_FILE (session-scoped, default)
  #                settingsJson     — write to .claude/settings.json env block (committed)
  #                settingsLocalJson — write to .claude/settings.local.json env block (gitignored)
  #
  # Example:
  #   secrets:
  #     - envVar: BRAINTRUST_API_KEY
  #       reference: "op://Personal/Braintrust/api-key"
  #       target: envFile
  #     - envVar: ANTHROPIC_API_KEY
  #       reference: "op://Work/Claude API Key/credential"
  #       target: envFile
  secrets: []
