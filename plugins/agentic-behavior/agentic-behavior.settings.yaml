agentic-behavior:
  enabled: true
  # Path to a git repository for storing memory files
  # Leave empty to disable git-backed memory sync
  gitRepo: ''
  # Git branch to use for memory storage
  gitBranch: 'main'
  # When to show the self-check reminder: "always", "first" (once per session), or "none"
  selfCheckReminder: 'always'
  # Files to sync to the memory repo
  # Default: ~/.claude/CLAUDE.md, ~/.claude/history.jsonl, and project CLAUDE.md
  # memorySources:
  #   - "~/.claude/CLAUDE.md"
  #   - "~/.claude/history.jsonl"

  # --- Notification settings ---
  # Send notifications when key agent events occur.
  # Both telegram and discord are optional. Configure one or both.
  notifications:
    # Global toggle for all notifications
    enabled: false
    telegram:
      # Telegram chat ID to send notifications to (required — no default)
      chatId: ''
      # Bot token — use env var reference; injected at runtime (e.g., by 1Password)
      botToken: '${TELEGRAM_BOT_TOKEN}'
    discord:
      # Discord channel ID to send notifications to (required — no default)
      channelId: ''
      # Bot token — use env var reference; injected at runtime (e.g., by 1Password)
      botToken: '${DISCORD_BOT_TOKEN}'
    # Per-event toggles (all default to true when notifications.enabled is true)
    events:
      promptSave: true
      memorySync: true
      cronCreate: true
      cronDelete: true
