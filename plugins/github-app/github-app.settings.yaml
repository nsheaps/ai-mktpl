# github-app plugin configuration
#
# Override per-project via ${CLAUDE_PROJECT_DIR}/.claude/plugins.settings.yaml
# or per-user via ~/.claude/plugins.settings.yaml under the "github-app" key.
#
# Set enabled: false to disable token management without uninstalling.
#
# --- Static credentials ---
#
# The plugin no longer manages static credential resolution. The launcher
# (bin/agent) is responsible for sourcing the agent's .env / .env.local so
# the following env vars are present at hook time:
#
#   GITHUB_APP_ID
#   GITHUB_APP_INSTALLATION_ID
#   GITHUB_APP_PRIVATE_KEY_PATH   (absolute path to PEM)
#
# If any are missing, the plugin fails loudly at SessionStart.

github-app:
  enabled: true

  # Automatically configure git user.name and user.email from the
  # GitHub App's bot identity (e.g., "my-app[bot]" with noreply email).
  # Skipped if git user.name/email are already configured.
  # Set to false to disable.
  autoGitConfig: true

  # Where to write the token. Defaults to ${XDG_CONFIG_HOME}/github-app/token.
  # tokenFile: "~/.agents/<agent-name>/.config/github-app/token"
