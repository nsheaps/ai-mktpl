# github-app plugin configuration
#
# Override per-project via ${CLAUDE_PROJECT_DIR}/.claude/plugins.settings.yaml
# or per-user via ~/.claude/plugins.settings.yaml under the "github-app" key.

github-app:
  enabled: true
  autoGitConfig: true
  # How long SessionStart waits for env vars to appear (seconds).
  # Set to 0 to disable the wait entirely.
  waitForEnvTimeoutSeconds: 15

  # --- Hook-driven event delivery ---
  # Controls how GitHub events are delivered to Claude and/or the user.
  # Requires eventsRepo to be set; no-ops otherwise.
  #
  # eventsDelivery modes:
  #   disabled -- (default) no fetch, no delivery
  #   file     -- append events to audit log only; nothing shown to Claude/user
  #   user     -- full event list as systemMessage (user-facing transcript)
  #   both     -- full event list as systemMessage AND additionalContext (Claude-facing)
  #   summary  -- systemMessage="events received from github" (user); full details as additionalContext (Claude)
  eventsDelivery: 'disabled'

  # Repository to watch for events (owner/repo). Required for any delivery.
  eventsRepo: ''

  # Seconds between event poll attempts (used by events-monitor.sh and the
  # Stop hook polling loop).
  eventsPollIntervalSeconds: 15

  # Stop hook: maximum seconds to poll for events before allowing the session
  # to stop. After this duration, the stop proceeds regardless of events.
  eventsStopTimeoutSeconds: 600

  # Stop hook: seconds after which a "no events received" notice is emitted to
  # Claude (and/or user) if no events have arrived. Must be < eventsStopTimeoutSeconds.
  eventsStopNoticeSeconds: 480
