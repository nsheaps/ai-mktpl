name: Sync Plugin Specs

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/SKILL.md'
      - 'plugins/**/hooks.json'
      - 'plugins/**/rules/*.md'
      - 'plugins/**/commands/*.md'
      - 'plugins/**/agents/*.md'
      - 'plugins/**/SPEC.md'
      - '.github/workflows/sync-plugin-specs.yaml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync-specs:
    uses: nsheaps/github-actions/.github/workflows/sync-plugin-specs.yaml@c1794f6f4fbb3cbc5e5a71e820581a74239f706a # main
    permissions:
      contents: write
    with:
      plugins-dir: plugins
