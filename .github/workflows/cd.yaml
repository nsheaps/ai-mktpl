name: cd

'on':
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - '.github/workflows/cd.yaml'
      - '.github/actions/detect-plugin-changes/**'
      # Ignore version/marketplace files to prevent bump loops
      - '!plugins/*/.claude-plugin/plugin.json'
      - '!.claude-plugin/marketplace.json'
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/cd.yaml'
      - '.github/actions/detect-plugin-changes/**'
      # Ignore version/marketplace files to prevent bump loops
      - '!plugins/*/.claude-plugin/plugin.json'
      - '!.claude-plugin/marketplace.json'
  workflow_dispatch:
    inputs:
      from_sha:
        description: 'commit sha from...HEAD to determine what to bump (overrides tag-based detection)'
        required: false
        default: ''
        type: string

concurrency:
  # On push to main, share concurrency group with CI to prevent races where
  # both CI (lint auto-fix) and CD (version bump) try to push commits
  # simultaneously. On PRs, use a separate group since CD only previews.
  group: ${{ github.ref == 'refs/heads/main' && 'ci-cd-main' || format('cd-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # For PRs: Auto-bump versions and update marketplace in the PR branch
  # Pushes changes back to the PR branch (like lint auto-fix).
  # Does NOT use [skip ci] so CI re-runs to validate the final state.
  # Loop prevention: skips if latest commit is from a previous auto-bump.
  auto-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          ref: ${{ github.head_ref }}
          fetch-depth: '0'

      - name: Check if latest commit is auto-bump (loop prevention)
        id: check-skip
        run: |
          LAST_MSG=$(git log -1 --format='%s')
          if [[ "$LAST_MSG" == "chore: auto-bump plugin versions and update marketplace" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Latest commit is from auto-bump, skipping to prevent loop"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch base branch and tags
        if: steps.check-skip.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF":refs/remotes/origin/"$BASE_REF"
          git fetch origin --tags

      - name: Resolve base ref from release tag
        if: steps.check-skip.outputs.skip != 'true'
        id: resolve-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          TAG_NAME="cd/last-release"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "base-ref=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Using release tag '$TAG_NAME' ($(git rev-parse --short $TAG_NAME)) as base ref"
          else
            echo "base-ref=$BASE_REF" >> $GITHUB_OUTPUT
            echo "Release tag '$TAG_NAME' not found, falling back to base branch '$BASE_REF'"
          fi

      - name: mise install -y
        if: steps.check-skip.outputs.skip != 'true'
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Install yarn dependencies
        if: steps.check-skip.outputs.skip != 'true'
        run: yarn install --immutable

      - name: Auto-bump changed plugins and update marketplace
        if: steps.check-skip.outputs.skip != 'true'
        id: bump
        shell: bash
        env:
          BASE_REF: ${{ steps.resolve-base.outputs.base-ref }}
        run: |
          # Resolve base ref for git commands
          if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            RESOLVED_BASE="origin/$BASE_REF"
          elif git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            RESOLVED_BASE="$BASE_REF"
          else
            RESOLVED_BASE="HEAD~1"
          fi

          BUMPED_PLUGINS=()
          SKIPPED_PLUGINS=()
          REPORT_MD="| Plugin | Base | Current | Action |\n|---|---|---|---|"

          for plugin_dir in plugins/*; do
            [ -d "$plugin_dir" ] || continue
            PLUGIN_NAME=$(basename "$plugin_dir")
            PLUGIN_JSON="$plugin_dir/.claude-plugin/plugin.json"
            [ -f "$PLUGIN_JSON" ] || continue

            # Check for code changes (excluding plugin.json and CHANGELOG.md)
            HAS_CHANGES=false
            if git diff --name-only "$RESOLVED_BASE..HEAD" -- "$plugin_dir" 2>/dev/null \
              | grep -v 'CHANGELOG.md$' | grep -v 'plugin.json$' | grep -q .; then
              HAS_CHANGES=true
            fi

            # Check symlink target changes
            if [ "$HAS_CHANGES" = "false" ]; then
              if mise run _has-symlink-changes "$plugin_dir" "$RESOLVED_BASE" 2>/dev/null; then
                HAS_CHANGES=true
              fi
            fi

            [ "$HAS_CHANGES" = "true" ] || continue

            # Get base version (version before this PR)
            BASE_VERSION=$(git show "$RESOLVED_BASE:$PLUGIN_JSON" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "0.0.0")
            # Get current version in PR head
            HEAD_VERSION=$(jq -r '.version' "$PLUGIN_JSON" 2>/dev/null || echo "0.0.0")

            # If head version is already higher than base, respect the manual/previous bump
            if [ "$HEAD_VERSION" != "$BASE_VERSION" ]; then
              HIGHER=$(printf '%s\n%s' "$HEAD_VERSION" "$BASE_VERSION" | sort -V | tail -1)
              if [ "$HIGHER" = "$HEAD_VERSION" ]; then
                echo "✅ $PLUGIN_NAME: already bumped $BASE_VERSION → $HEAD_VERSION (keeping)"
                SKIPPED_PLUGINS+=("$PLUGIN_NAME")
                REPORT_MD="$REPORT_MD\n| $PLUGIN_NAME | $BASE_VERSION | $HEAD_VERSION | Already bumped |"
                continue
              fi
            fi

            # Auto-bump via release-it (patch increment)
            echo "⬆️  $PLUGIN_NAME: auto-bumping from $HEAD_VERSION"
            cd "plugins/$PLUGIN_NAME"
            if ! yarn exec release-it --ci 2>&1; then
              echo "::error::release-it failed for plugin '$PLUGIN_NAME'"
              cd ../..
              continue
            fi
            cd ../..

            NEW_VERSION=$(jq -r '.version' "$PLUGIN_JSON")
            BUMPED_PLUGINS+=("$PLUGIN_NAME")
            REPORT_MD="$REPORT_MD\n| $PLUGIN_NAME | $BASE_VERSION | $NEW_VERSION | Auto-bumped |"
          done

          # Always regenerate marketplace (idempotent, picks up new plugins too)
          mise run update-marketplace

          # Lint everything
          mise run lint

          # Check if any files changed
          if [ -n "$(git status --porcelain)" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

          # Save report for PR comment
          {
            echo "report-md<<EOF"
            printf '%b' "$REPORT_MD"
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Commit and push all changes at once
        if: steps.check-skip.outputs.skip != 'true' && steps.bump.outputs.has-changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: auto-bump plugin versions and update marketplace'
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}

      - name: Post version status comment
        if: steps.check-skip.outputs.skip != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: 'plugin-versions'
          message: |
            ### Plugin Version Status
            _Versions are auto-bumped in PRs. Manual bumps to higher versions are preserved._

            ${{ steps.bump.outputs.report-md }}

  # For main: Bump only plugins that weren't already bumped in the PR,
  # then update marketplace metadata.
  bump-and-update-marketplace:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          fetch-depth: '0'

      - name: Resolve base ref from release tag
        id: resolve-base
        env:
          FROM_SHA: ${{ inputs.from_sha }}
        run: |
          TAG_NAME="cd/last-release"
          # workflow_dispatch with explicit from_sha takes priority
          if [ -n "$FROM_SHA" ]; then
            echo "base-ref=$FROM_SHA" >> $GITHUB_OUTPUT
            echo "Using workflow_dispatch override: $FROM_SHA"
          elif git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "base-ref=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Using release tag '$TAG_NAME' ($(git rev-parse --short $TAG_NAME)) as base ref"
          else
            echo "base-ref=HEAD~1" >> $GITHUB_OUTPUT
            echo "Release tag '$TAG_NAME' not found, falling back to HEAD~1"
          fi

      - name: mise install -y
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: false

      - name: Install yarn dependencies
        run: yarn install --immutable

      - name: Detect plugin changes
        id: detect
        uses: ./.github/actions/detect-plugin-changes
        with:
          base-ref: ${{ steps.resolve-base.outputs.base-ref }}

      - name: Bump versions for changed plugins (skip already bumped)
        if: steps.detect.outputs.has-changes == 'true'
        shell: bash
        env:
          PLUGINS: ${{ steps.detect.outputs.plugins }}
          BASE_REF: ${{ steps.resolve-base.outputs.base-ref }}
        run: |
          # Resolve base ref for git commands
          if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            RESOLVED_BASE="origin/$BASE_REF"
          elif git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            RESOLVED_BASE="$BASE_REF"
          else
            RESOLVED_BASE="HEAD~1"
          fi

          FAILED_PLUGINS=()
          for plugin_name in $PLUGINS; do
            echo "::group::Checking version for $plugin_name"
            PLUGIN_JSON="plugins/$plugin_name/.claude-plugin/plugin.json"

            # Get base version and current version
            BASE_VERSION=$(git show "$RESOLVED_BASE:$PLUGIN_JSON" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "0.0.0")
            HEAD_VERSION=$(jq -r '.version' "$PLUGIN_JSON" 2>/dev/null || echo "0.0.0")

            # Skip if already bumped (version at HEAD > version at base)
            if [ "$HEAD_VERSION" != "$BASE_VERSION" ]; then
              HIGHER=$(printf '%s\n%s' "$HEAD_VERSION" "$BASE_VERSION" | sort -V | tail -1)
              if [ "$HIGHER" = "$HEAD_VERSION" ]; then
                echo "✅ $plugin_name: already bumped in PR ($BASE_VERSION → $HEAD_VERSION), skipping"
                echo "::endgroup::"
                continue
              fi
            fi

            echo "⬆️  $plugin_name: bumping from $HEAD_VERSION"
            cd "plugins/$plugin_name"
            if ! yarn exec release-it --ci 2>&1; then
              echo "::error::release-it failed for plugin '$plugin_name'"
              FAILED_PLUGINS+=("$plugin_name")
            fi
            cd ../..
            echo "::endgroup::"
          done
          if [ ${#FAILED_PLUGINS[@]} -gt 0 ]; then
            echo "::error::Version bump failed for plugins: ${FAILED_PLUGINS[*]}"
            echo "Hint: Ensure each plugin has a .release-it.js that extends ../../.release-it.base.json"
            exit 1
          fi

      - name: Run lint after version bump
        if: steps.detect.outputs.has-changes == 'true'
        run: mise run lint

      - name: Commit version bumps
        if: steps.detect.outputs.has-changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: bump plugin versions [skip ci]'
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}
          file_pattern: 'plugins/*/.claude-plugin/plugin.json plugins/*/CHANGELOG.md'
          push_options: '--no-verify'
          skip_push: true

      - name: Update marketplace metadata
        run: mise run update-marketplace

      - name: Run lint after marketplace update
        run: mise run lint

      - name: Commit marketplace changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update marketplace metadata [skip ci]'
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}
          file_pattern: '.claude-plugin/marketplace.json'
          push_options: '--no-verify'
          skip_push: true

      - name: Push all changes
        run: git push

      - name: Update release tag
        run: |
          TAG_NAME="cd/last-release"
          git tag -f "$TAG_NAME" HEAD
          git push origin "$TAG_NAME" --force
          echo "Moved tag '$TAG_NAME' to $(git rev-parse --short HEAD)"
