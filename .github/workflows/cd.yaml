name: cd

'on':
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - '.github/workflows/cd.yaml'
      - '.github/actions/detect-plugin-changes/**'
      # Ignore version/marketplace files to prevent bump loops
      - '!plugins/*/.claude-plugin/plugin.json'
      - '!.claude-plugin/marketplace.json'
  pull_request:
    paths:
      - 'plugins/**'
      - '.github/workflows/cd.yaml'
      - '.github/actions/detect-plugin-changes/**'
      # Ignore version/marketplace files to prevent bump loops
      - '!plugins/*/.claude-plugin/plugin.json'
      - '!.claude-plugin/marketplace.json'
  workflow_dispatch:
    inputs:
      from_sha:
        description: 'commit sha from...HEAD to determine what to bump (overrides tag-based detection)'
        required: false
        default: ''
        type: string

concurrency:
  # On push to main, share concurrency group with CI to prevent races where
  # both CI (lint auto-fix) and CD (version bump) try to push commits
  # simultaneously. On PRs, use a separate group since CD only previews.
  group: ${{ github.ref == 'refs/heads/main' && 'ci-cd-main' || format('cd-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # For PRs: Preview version bumps only (no commits)
  preview-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch base branch and tags
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF":refs/remotes/origin/"$BASE_REF"
          git fetch origin --tags

      - name: Resolve base ref from release tag
        id: resolve-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          TAG_NAME="cd/last-release"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "base-ref=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Using release tag '$TAG_NAME' ($(git rev-parse --short $TAG_NAME)) as base ref"
          else
            echo "base-ref=$BASE_REF" >> $GITHUB_OUTPUT
            echo "Release tag '$TAG_NAME' not found, falling back to base branch '$BASE_REF'"
          fi

      - name: mise install -y
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: ${{ github.event_name == 'pull_request'}}

      - name: Detect plugin changes
        id: detect
        uses: ./.github/actions/detect-plugin-changes
        with:
          base-ref: ${{ steps.resolve-base.outputs.base-ref }}

      - name: Post version preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: 'plugin-versions'
          message: |
            ### Plugin Version Bumps (Preview)
            _These versions will be bumped when merged to main._

            ${{ steps.detect.outputs.report-md }}

  # For main: Bump versions and update marketplace
  bump-and-update-marketplace:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          fetch-depth: '0'

      - name: Resolve base ref from release tag
        id: resolve-base
        env:
          FROM_SHA: ${{ inputs.from_sha }}
        run: |
          TAG_NAME="cd/last-release"
          # workflow_dispatch with explicit from_sha takes priority
          if [ -n "$FROM_SHA" ]; then
            echo "base-ref=$FROM_SHA" >> $GITHUB_OUTPUT
            echo "Using workflow_dispatch override: $FROM_SHA"
          elif git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "base-ref=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "Using release tag '$TAG_NAME' ($(git rev-parse --short $TAG_NAME)) as base ref"
          else
            echo "base-ref=HEAD~1" >> $GITHUB_OUTPUT
            echo "Release tag '$TAG_NAME' not found, falling back to HEAD~1"
          fi

      - name: mise install -y
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: ${{ github.event_name == 'pull_request'}}

      - name: Install yarn dependencies
        run: yarn install --immutable

      - name: Detect plugin changes
        id: detect
        uses: ./.github/actions/detect-plugin-changes
        with:
          base-ref: ${{ steps.resolve-base.outputs.base-ref }}

      - name: Bump versions for changed plugins
        if: steps.detect.outputs.has-changes == 'true'
        shell: bash
        run: |
          FAILED_PLUGINS=()
          for plugin_name in ${{ steps.detect.outputs.plugins }}; do
            echo "::group::Bumping version for $plugin_name"
            cd "plugins/$plugin_name"
            if ! yarn exec release-it --ci 2>&1; then
              echo "::error::release-it failed for plugin '$plugin_name'"
              FAILED_PLUGINS+=("$plugin_name")
            fi
            cd ../..
            echo "::endgroup::"
          done
          if [ ${#FAILED_PLUGINS[@]} -gt 0 ]; then
            echo "::error::Version bump failed for plugins: ${FAILED_PLUGINS[*]}"
            echo "Hint: Ensure each plugin has a .release-it.js that extends ../../.release-it.base.json"
            exit 1
          fi

      - name: Run lint after version bump
        if: steps.detect.outputs.has-changes == 'true'
        run: mise run lint

      - name: Commit version bumps
        if: steps.detect.outputs.has-changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: bump plugin versions [skip ci]'
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}
          file_pattern: 'plugins/*/.claude-plugin/plugin.json plugins/*/CHANGELOG.md'
          push_options: '--no-verify'
          skip_push: true

      - name: Update marketplace metadata
        run: mise run update-marketplace

      - name: Run lint after marketplace update
        run: mise run lint

      - name: Commit marketplace changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update marketplace metadata [skip ci]'
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}
          file_pattern: '.claude-plugin/marketplace.json'
          push_options: '--no-verify'
          skip_push: true

      - name: Push all changes
        run: git push

      - name: Update release tag
        run: |
          TAG_NAME="cd/last-release"
          git tag -f "$TAG_NAME" HEAD
          git push origin "$TAG_NAME" --force
          echo "Moved tag '$TAG_NAME' to $(git rev-parse --short HEAD)"
