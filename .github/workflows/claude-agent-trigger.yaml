name: Claude Agent Trigger

# Detects events that should trigger Claude agent and dispatches to agent workflow
# Schema: .github/schemas/claude-agent-payload.schema.json

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  dispatch:
    # Pre-filter: only run if @claude appears somewhere in the event body/title.
    # A second step (check-mention) applies a word-boundary regex to avoid
    # false positives like "plugin-dev@claude-plugins-official".
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check for word-boundary @claude mention
        id: check-mention
        env:
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || '' }}
          ISSUE_TITLE: ${{ github.event.issue.title || '' }}
        run: |
          # Match @claude only when preceded by start-of-string or whitespace,
          # and followed by end-of-string, whitespace, or a character that is NOT
          # a word character or hyphen. [[:punct:]] includes '-', which caused
          # @claude-code and @claude-* variants to incorrectly match. Using a
          # negated class [^a-zA-Z0-9_-] explicitly excludes hyphens.
          if printf '%s\n' "$COMMENT_BODY" | grep -qP '(^|\s)@claude(\s|$|[^a-zA-Z0-9_-])' || \
             printf '%s\n' "$ISSUE_TITLE"  | grep -qP '(^|\s)@claude(\s|$|[^a-zA-Z0-9_-])'; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout and authenticate as GitHub App
        if: steps.check-mention.outputs.matched == 'true'
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          persist-credentials: false

      - name: Dispatch to Claude agent
        if: steps.check-mention.outputs.matched == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: claude-agent
          token: ${{ steps.auth.outputs.token }}
          # Schema: .github/schemas/claude-agent-payload.schema.json
          client-payload: |
            {
              "prompt": ${{ toJson(github.event.comment.body || github.event.review.body || github.event.issue.body) }},
              "trigger": {
                "type": "${{ github.event_name }}",
                "action": "${{ github.event.action }}"
              },
              "source": {
                "repo": "${{ github.repository }}",
                "issue_number": ${{ github.event.issue.number || 'null' }},
                "pr_number": ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || 'null' }},
                "comment_id": ${{ github.event.comment.id || github.event.review.id || 'null' }},
                "ref": "${{ github.ref }}"
              },
              "author": {
                "login": "${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}",
                "association": "${{ github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association }}"
              },
              "content": {
                "title": ${{ toJson(github.event.issue.title || github.event.pull_request.title) }},
                "body": ${{ toJson(github.event.comment.body || github.event.review.body || github.event.issue.body) }}
              }
            }
